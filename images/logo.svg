<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#C5A5A5"/>

  <!-- Inner circle border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="white" stroke-width="3"/>

  <!-- Handwritten "V" -->
  <g>
    <!-- V letter path -->
    <path d="M 50 50 Q 60 80, 100 140" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 140 Q 130 90, 150 50" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Decorative line under V -->
    <path d="M 55 145 Q 100 150, 145 145" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text "Art Studio Vanja" -->
  <text x="100" y="175" font-family="Kalam, cursive" font-size="18" fill="white" text-anchor="middle" font-weight="400">Art Studio Vanja</text>
</svg>
